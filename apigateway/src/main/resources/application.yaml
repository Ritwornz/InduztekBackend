server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ruta-ms-usuarios
              uri: lb://MS-USUARIOS
              predicates:
                - Path=/api/usuarios,/api/usuarios/**
            - id: ruta-ms-protocolos
              uri: lb://MS-PROTOCOLOS
              predicates:
                - Path=/api/protocolos,/api/protocolos/**
            - id: ruta-ms-mediciones
              uri: lb://MS-MEDICIONES
              predicates:
                - Path=/api/mediciones,/api/mediciones/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: api-gateway
    instance-id: api-gateway:8081

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
