# ============================================================
# eureka-server - application.properties
# ============================================================
# CAMBIO DOCKER: el hostname pasa de "localhost" a "eureka-server"
# que es el nombre del servicio definido en docker-compose.yml.
# Docker crea una red interna donde los contenedores se conocen
# por el nombre del servicio, NO por localhost ni por IP.
# ============================================================

server.port=8761

spring.application.name=eureka-server

# Eureka no debe registrarse en si mismo (sin cambio)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# NUEVO DOCKER: URL interna usando nombre de servicio Docker.
# En modo local era: http://localhost:8761/eureka/
# En Docker usamos "eureka-server" (resuelto automaticamente por el DNS de Docker)
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# NUEVO DOCKER: el hostname que Eureka anuncia a los demas contenedores
# debe ser el nombre del servicio en docker-compose, no "localhost"
eureka.instance.hostname=eureka-server

logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO


